# Compile l'appli Android signée à chaque modification de android-app/, puis la publie en Release
# « android-vN ». Le serveur du panneau récupère ensuite l'APK (jeton en lecture seule) et le propose
# dans l'appli. Secrets du dépôt requis : ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD.
name: Appli Android

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Les versions locales valent 1 : celles de GitHub partent de 101 pour toujours être plus récentes
      APP_VERSION_CODE: ${{ github.run_number }}00
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dépendances et synchronisation Capacitor
        working-directory: android-app
        run: |
          npm ci
          npx cap sync android

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 manquant"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/twitchdeck.jks"

      - name: Compilation de l'APK signé
        working-directory: android-app/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/twitchdeck.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APP_VERSION_NAME: 1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/twitch-deck-1.${{ github.run_number }}.apk"

      - name: Publication en Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${APP_VERSION_CODE}" "$RUNNER_TEMP/twitch-deck-1.${{ github.run_number }}.apk" \
            --title "Appli Android 1.${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)" \
            --target "${{ github.sha }}"

      - name: Nettoyage de la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/twitchdeck.jks"
