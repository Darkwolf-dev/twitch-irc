# Dependabot : propose une PR quand une dépendance a une nouvelle version.
# Vérification chaque matin à 8 h ; les mises à jour npm sont regroupées en une seule PR.
# Les failles de sécurité, elles, déclenchent une PR immédiate (réglage « security updates »).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "08:00"
      timezone: Europe/Paris
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 3

  # Image de base Node (Dockerfile)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 2

  # cloudflared (docker-compose.tunnel.yml)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 2
